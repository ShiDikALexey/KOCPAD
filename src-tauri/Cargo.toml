[package]
name = "kocpad"
version = "1.3.0"
description = "KOCPAD вЂ” a markdown notepad for Windows"
authors = ["KOCPAD contributors"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[lib]
name = "kocpad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
