[package]
name = "kocpad"
version = "1.5.3-beta.7"
description = "KOCPAD - a markdown notepad for Windows"
authors = ["KOCPAD contributors"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[lib]
name = "kocpad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# WebView2 settings live in the COM interfaces; used on Windows to turn off the
# browser-specific accelerator keys (Ctrl+P, Ctrl+F, F5, devtools) in release
# builds so the app's own shortcuts receive them.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
