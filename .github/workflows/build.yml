name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Typecheck and build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build frontend
        run: npx vite build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: kocpad-frontend
          path: dist
          retention-days: 7

  windows:
    name: Build Windows installers
    runs-on: windows-latest
    env:
      # Optional code signing. Set both secrets and the binaries are signed; with
      # no certificate the step is skipped and the build stays unsigned.
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Check configuration files for a BOM
        shell: pwsh
        run: |
          $files = @('package.json', 'src-tauri/tauri.conf.json', 'src-tauri/Cargo.toml')
          foreach ($file in $files) {
            $bytes = [System.IO.File]::ReadAllBytes((Join-Path $PWD $file))
            if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
              throw "UTF-8 BOM found in $file — Tauri's JSON/TOML parsers reject it. Write the file as UTF-8 without BOM."
            }
          }
          Write-Host 'No BOM in configuration files'

      - name: Build Tauri app
        run: npm run tauri:build

      - name: Sign binaries
        if: env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'kocpad-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found on the runner' }

          $targets = @('src-tauri\target\release\kocpad.exe') +
            (Get-ChildItem 'src-tauri\target\release\bundle\nsis\*.exe').FullName +
            (Get-ChildItem 'src-tauri\target\release\bundle\msi\*.msi').FullName

          foreach ($target in $targets) {
            Write-Host "Signing $target"
            & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD `
              /tr http://timestamp.digicert.com /td sha256 /fd sha256 $target
            if ($LASTEXITCODE -ne 0) { throw "Signing failed for $target" }
          }

          Remove-Item $pfx -Force

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: kocpad-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/kocpad.exe
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Attach installers to a release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kocpad-windows
          path: artifacts

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
