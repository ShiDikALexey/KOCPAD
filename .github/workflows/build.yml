name: build

on:
  push:
    branches: [main, beta]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Typecheck and build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check that versions and the tag agree
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/check-versions.cjs

      - name: Typecheck
        run: npm run typecheck

      - name: Build frontend
        run: npx vite build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: kocpad-frontend
          path: dist
          retention-days: 7

  e2e:
    name: End-to-end smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
          if-no-files-found: ignore

  windows:
    name: Build Windows installers
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Only booleans live on the job level: the secrets themselves are scoped to
      # the steps that need them, never to `npm ci` or crate build scripts.
      HAS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Verify Cargo.lock matches Cargo.toml
        shell: pwsh
        run: |
          if (-not (Test-Path src-tauri/Cargo.lock)) {
            cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
            if ($LASTEXITCODE -ne 0) { throw 'cargo generate-lockfile failed' }
          }
          # --locked fails when the committed lockfile does not satisfy Cargo.toml.
          # Do not run `cargo generate-lockfile` here: it re-resolves and would
          # "update" pinned crates whenever a new version is published.
          cargo metadata --locked --format-version 1 --manifest-path src-tauri/Cargo.toml *> $null
          if ($LASTEXITCODE -ne 0) {
            throw 'Cargo.lock is stale: run cargo generate-lockfile locally and commit the result'
          }
          exit 0

      - name: Upload Cargo.lock
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 7

      - name: Install dependencies
        run: npm ci

      - name: Check configuration files for a BOM
        shell: pwsh
        run: |
          $files = @('package.json', 'package-lock.json', 'src-tauri/tauri.conf.json', 'src-tauri/Cargo.toml', 'src-tauri/capabilities/default.json')
          foreach ($file in $files) {
            $bytes = [System.IO.File]::ReadAllBytes((Join-Path $PWD $file))
            if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
              throw "UTF-8 BOM found in $file — Tauri's JSON/TOML parsers reject it. Write the file as UTF-8 without BOM."
            }
          }
          Write-Host 'No BOM in configuration files'

      - name: Prepare bundle for this version
        run: node scripts/prepare-build.cjs

      - name: Enable updater artifacts when a signing key exists
        shell: pwsh
        env:
          # Secrets are scoped to the steps that actually need them, so `npm ci`
          # and crate build scripts never see the signing key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/enable-updater.cjs

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build

      - name: Native smoke (the built app opens a window)
        shell: pwsh
        run: |
          $exe = Resolve-Path 'src-tauri\target\release\kocpad.exe'
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          $process.Refresh()
          if ($process.HasExited) {
            throw "KOCPAD exited early with code $($process.ExitCode)"
          }
          if (-not $process.MainWindowTitle) {
            throw 'KOCPAD did not open a window'
          }
          Write-Host "window: $($process.MainWindowTitle)"
          Stop-Process -Id $process.Id -Force

      - name: Sign binaries
        if: env.HAS_CERTIFICATE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'kocpad-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found on the runner' }

          $targets = @('src-tauri\target\release\kocpad.exe') +
            (Get-ChildItem 'src-tauri\target\release\bundle\nsis\*.exe').FullName +
            (Get-ChildItem 'src-tauri\target\release\bundle\msi\*.msi').FullName

          foreach ($target in $targets) {
            Write-Host "Signing $target"
            & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD `
              /tr http://timestamp.digicert.com /td sha256 /fd sha256 $target
            if ($LASTEXITCODE -ne 0) { throw "Signing failed for $target" }
          }

          Remove-Item $pfx -Force

      - name: Re-sign updater artifacts after Authenticode
        if: env.HAS_CERTIFICATE == 'true'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Authenticode rewrites the installer bytes, so the minisign .sig from
          # the build no longer matches. Sign the *signed* installer again;
          # otherwise every auto-update would fail the signature check.
          if ($env:TAURI_SIGNING_PRIVATE_KEY -eq '') {
            throw 'Authenticode signing requires the updater key to re-sign the installers'
          }
          $installers = Get-ChildItem 'src-tauri\target\release\bundle\nsis\*.exe'
          foreach ($installer in $installers) {
            $sig = "$($installer.FullName).sig"
            Remove-Item $sig -ErrorAction SilentlyContinue
            npx tauri signer sign $installer.FullName
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $sig)) {
              throw "Re-signing failed for $($installer.Name)"
            }
          }

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: kocpad-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/kocpad.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach installers to a release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check that versions and the tag agree
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/check-versions.cjs

      - uses: actions/download-artifact@v4
        with:
          name: kocpad-windows
          path: artifacts

      - name: Write release notes from CHANGELOG.md
        run: node scripts/changelog-notes.cjs artifacts/RELEASE_NOTES.md

      - name: Build updater metadata
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          EXPECT_SIGNATURES: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: node scripts/make-latest-json.cjs artifacts

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem artifacts -Recurse -File | Sort-Object Name
          if ($files.Count -eq 0) { throw 'No installers to checksum' }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          # LF line endings, UTF-8 without BOM: that is what sha256sum expects.
          $text = ($lines -join "`n") + "`n"
          [IO.File]::WriteAllText((Join-Path $PWD 'artifacts/SHA256SUMS.txt'), $text, (New-Object System.Text.UTF8Encoding($false)))
          Get-Content artifacts/SHA256SUMS.txt

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body_path: artifacts/RELEASE_NOTES.md
          generate_release_notes: false
          # A suffix in the tag (`v1.5.0-beta.1`) marks a pre-release, so
          # `/releases/latest` — and therefore the updater — keeps pointing at
          # the last plain release. A rejected beta must not reach users.
          prerelease: ${{ contains(github.ref_name, '-') }}
